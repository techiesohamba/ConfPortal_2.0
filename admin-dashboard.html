<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Conference Management</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e293b;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.25rem;
    }
    .user-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .btn-logout {
      background: #ef4444;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1rem;
      flex: 1;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #fff;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      border-left: 4px solid #2563eb;
    }
    .stat-card h3 {
      font-size: 0.875rem;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .stat-card p {
      font-size: 1.75rem;
      font-weight: 700;
      color: #111827;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .btn-primary {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover {
      background-color: #1d4ed8;
    }
    .table-container {
      background: white;
      border-radius: 8px;
      overflow-x: auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    thead th {
      background-color: #f8fafc;
      padding: 0.9rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      border-bottom: 1px solid #e2e8f0;
    }
    tbody td {
      padding: 1rem;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.9rem;
    }
    tbody tr:hover {
      background-color: #f8fafc;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-upcoming { background: #dbeafe; color: #1e40af; }
    .badge-completed { background: #e2e8f0; color: #475569; }
    .badge-cancelled { background: #fee2e2; color: #b91c1c; }
    .action-btn {
      border: none;
      padding: 0.35rem 0.65rem;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-right: 0.3rem;
    }
    .edit-btn { background: #fef3c7; color: #92400e; }
    .delete-btn { background: #fee2e2; color: #991b1b; }

    /* Modal Form */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .close-btn {
      font-size: 1.5rem;
      border: none;
      background: none;
      cursor: pointer;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.3rem;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .btn-nav {
      background: transparent;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .btn-nav:hover {
      background: #334155;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <header>
    <h1>Conference Admin Portal</h1>
    <div class="user-actions">
      <span id="admin-greeting">Welcome, Admin</span>
      <a href="index.html" class="btn-nav">Browse Portal</a>
      <a href="community.html" class="btn-nav">💬 Community</a>
      <a href="notifications.html" class="btn-nav">🔔 Alerts</a>
      <button class="btn-logout" onclick="logoutUser()">Logout</button>
    </div>
  </header>
  </header>

  <div class="container">
    <!-- Stat Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Conferences</h3>
        <p id="stat-total-conf">0</p>
      </div>
      <div class="stat-card">
        <h3>Total Registrations</h3>
        <p id="stat-total-bookings">0</p>
      </div>
      <div class="stat-card">
        <h3>Registered Speakers</h3>
        <p id="stat-total-speakers">0</p>
      </div>
    </div>

    <!-- Management Table Section -->
    <div class="section-header">
      <h2>Scheduled Conferences</h2>
      <button class="btn-primary" onclick="openModal()">+ Add Conference</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Date & Time</th>
            <th>Venue / Link</th>
            <th>Assigned Speaker</th>
            <th>Capacity / Booked</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="conference-table-body">
          <!-- Populated dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add / Edit Modal -->
  <div id="conference-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Schedule New Conference</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <form id="conference-form">
        <input type="hidden" id="conf-id" />
        
        <div class="form-group">
          <label for="conf-title">Title</label>
          <input type="text" id="conf-title" required placeholder="e.g. Annual AI & Web Summit" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="conf-date">Date</label>
            <input type="date" id="conf-date" required />
          </div>
          <div class="form-group">
            <label for="conf-time">Time</label>
            <input type="text" id="conf-time" placeholder="10:00 AM - 1:00 PM" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="conf-venue">Venue or Meeting Link</label>
            <input type="text" id="conf-venue" required placeholder="Hall A or Zoom URL" />
          </div>
          <div class="form-group">
            <label for="conf-capacity">Seat Capacity</label>
            <input type="number" id="conf-capacity" min="1" required placeholder="50" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="conf-speaker">Speaker</label>
            <select id="conf-speaker" required>
              <!-- Populated with role='speaker' users -->
            </select>
          </div>
          <div class="form-group">
            <label for="conf-status">Status</label>
            <select id="conf-status">
              <option value="Upcoming">Upcoming</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Save Conference</button>
      </form>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
