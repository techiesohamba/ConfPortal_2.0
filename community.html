
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Channel - ConfPortal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
    .nav-links { display: flex; gap: 0.8rem; align-items: center; }
    .btn { padding: 0.45rem 0.9rem; border-radius: 6px; text-decoration: none; font-size: 0.85rem; cursor: pointer; border: 1px solid #cbd5e1; background: #fff; }
    .btn-primary { background: #2563eb; color: #fff; border: none; }
    .container { max-width: 900px; width: 100%; margin: 2rem auto; padding: 0 1rem; flex: 1; display: flex; flex-direction: column; }
    .chat-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; flex: 1; display: flex; flex-direction: column; height: 600px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .chat-header { padding: 1rem 1.5rem; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
    .chat-messages { flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
    .msg-item { display: flex; flex-direction: column; max-width: 80%; }
    .msg-item.self { align-self: flex-end; }
    .msg-item.other { align-self: flex-start; }
    .msg-bubble { padding: 0.8rem 1rem; border-radius: 8px; font-size: 0.9rem; line-height: 1.4; position: relative; }
    .msg-item.self .msg-bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 1px; }
    .msg-item.other .msg-bubble { background: #f1f5f9; color: #1e293b; border-bottom-left-radius: 1px; }
    .msg-meta { font-size: 0.75rem; color: #64748b; margin-bottom: 0.3rem; display: flex; gap: 0.4rem; align-items: center; }
    .badge-role { font-size: 0.65rem; padding: 0.1rem 0.4rem; border-radius: 9999px; text-transform: uppercase; font-weight: 700; }
    .role-admin { background: #fee2e2; color: #991b1b; }
    .role-speaker { background: #fef3c7; color: #92400e; }
    .role-attendee { background: #e0e7ff; color: #3730a3; }
    .chat-footer { padding: 1rem; border-top: 1px solid #e2e8f0; display: flex; gap: 0.5rem; background: #fff; }
    .chat-input { flex: 1; padding: 0.7rem 1rem; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem; }
    .chat-input:focus { border-color: #2563eb; }
    .conf-select { padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; max-width: 250px; }
  </style>
</head>

<body>
  

  <header>
    <h2>Conference Community Channel</h2>
    <div class="nav-links">
      <a href="index.html" class="btn">Conferences</a>
      <a href="notifications.html" class="btn">Notifications</a>
      <button class="btn" onclick="logoutUser()">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="chat-box">
      <div class="chat-header">
        <div>
          <strong>Channel Discussion</strong>
          <span style="font-size: 0.8rem; color: #64748b; display: block;">Organizers, speakers, and attendees collaborate here</span>
        </div>
        <select id="conference-filter" class="conf-select" onchange="renderMessages()">
          <option value="All">All Discussions</option>
        </select>
      </div>

      <div class="chat-messages" id="messages-container">
        <!-- Injected dynamically -->
      </div>

      <form class="chat-footer" id="chat-form">
        <input type="text" id="message-input" class="chat-input" placeholder="Type your announcement or query..." required autocomplete="off" />
        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script>
    const user = getSessionUser();
    if (!user) {alert("Please sign in to access the community hub.");
  window.location.href = "auth.html";}
    else {
  // Only execute when user is valid
    document.addEventListener("DOMContentLoaded", () => {
    initFilters();
    renderMessages();
  });
}


    // Populate conference filter
    function initFilters() {
      const db = getDB();
      const select = document.getElementById("conference-filter");
      db.conferences.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.title;
        select.appendChild(opt);
      });
    }

    // Render messages based on selected conference filter
    function renderMessages() {
      const db = getDB();
      const container = document.getElementById("messages-container");
      const filterVal = document.getElementById("conference-filter").value;

      let messages = db.communityMessages || [];
      if (filterVal !== "All") {
        messages = messages.filter(m => m.conferenceId == filterVal);
      }

      container.innerHTML = "";
      if (messages.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: #94a3b8; margin: auto;">No messages in this channel yet. Start the conversation!</p>`;
        return;
      }

      messages.forEach(msg => {
        const isSelf = msg.senderId === user.id;
        const div = document.createElement("div");
        div.className = `msg-item ${isSelf ? "self" : "other"}`;

        div.innerHTML = `
          <div class="msg-meta" style="${isSelf ? 'justify-content: flex-end;' : ''}">
            <strong>${msg.senderName}</strong>
            <span class="badge-role role-${msg.senderRole}">${msg.senderRole}</span>
            <span>&bull; ${msg.timestamp}</span>
          </div>
          <div class="msg-bubble">
            ${msg.conferenceTitle ? `<div style="font-size: 0.75rem; opacity: 0.8; margin-bottom: 0.3rem;">[${msg.conferenceTitle}]</div>` : ""}
            ${msg.message}
          </div>
        `;
        container.appendChild(div);
      });

      // Scroll to bottom
      container.scrollTop = container.scrollHeight;
    }

    // Send Message Handler
    document.getElementById("chat-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const input = document.getElementById("message-input");
      const text = input.value.trim();
      if (!text) return;

      const filterVal = document.getElementById("conference-filter").value;
      const db = getDB();
      let confTitle = "";
      if (filterVal !== "All") {
        const found = db.conferences.find(c => c.id == filterVal);
        if (found) confTitle = found.title;
      }

      const newMsg = {
        id: Date.now(),
        senderId: user.id,
        senderName: user.name,
        senderRole: user.role,
        conferenceId: filterVal !== "All" ? parseInt(filterVal, 10) : null,
        conferenceTitle: confTitle,
        message: text,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      db.communityMessages.push(newMsg);
      saveDB(db);

      // If an organizer or speaker posts, broadcast an automated notification to participants
      if (user.role === "admin" || user.role === "speaker") {
        sendNotification(
          `New Announcement from ${user.name} (${user.role})`,
          text.length > 50 ? text.substring(0, 50) + "..." : text
        );
      }

      input.value = "";
      renderMessages();
    });

    document.addEventListener("DOMContentLoaded", () => {
      initFilters();
      renderMessages();
    });
  </script>
</body>
</html>
