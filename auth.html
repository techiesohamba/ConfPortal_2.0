<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conference Platform - Authentication</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .auth-header h1 {
      font-size: 1.5rem;
      color: #1f2937;
    }
    .tabs {
      display: flex;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #e5e7eb;
    }
    .tab-btn {
      flex: 1;
      padding: 0.6rem;
      border: none;
      background: none;
      font-size: 1rem;
      font-weight: 600;
      color: #6b7280;
      cursor: pointer;
    }
    .tab-btn.active {
      color: #2563eb;
      border-bottom: 2px solid #2563eb;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 0.3rem;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 0.95rem;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #2563eb;
    }
    .btn {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 4px;
      background-color: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .alert {
      padding: 0.6rem;
      border-radius: 4px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }
    .alert-error {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 1px solid #f87171;
    }
    .alert-success {
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
    }
    .demo-hint {
      margin-top: 1.5rem;
      padding: 0.8rem;
      background: #f9fafb;
      border-radius: 4px;
      font-size: 0.75rem;
      color: #6b7280;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <h1>Conference Portal</h1>
    </div>

    <!-- Alert Box -->
    <div id="alert-box" class="alert"></div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" required placeholder="admin@conf.com" />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>

    <!-- Register Form -->
    <form id="register-form" style="display: none;">
      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" required placeholder="e.g. Jane Doe" />
      </div>
      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <input type="email" id="reg-email" required placeholder="jane@example.com" />
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" required placeholder="Minimum 4 characters" />
      </div>
      <div class="form-group">
        <label for="reg-role">Role</label>
        <select id="reg-role">
          <option value="attendee">Attendee (Browse & Book)</option>
          <option value="speaker">Speaker (Manage Talks & Slides)</option>
          <option value="admin">Admin / Organizer (Full Control)</option>
        </select>
      </div>
      <button type="submit" class="btn">Create Account</button>
    </form>

    <!-- Seed Credential References -->
    <div class="demo-hint">
      <strong>Demo Accounts (Password: 123):</strong><br>
      • Admin: <code>admin@conf.com</code><br>
      • Speaker: <code>roy@conf.com</code><br>
      • Attendee: <code>attendee@conf.com</code>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
